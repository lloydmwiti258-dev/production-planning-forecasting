<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="7 planning dashboards, 600k+ POS order lines modelled, 20 sales channels in 8 regions, 1 to 12 month forecast horizon, shop targets reconcile to 100 percent of the company target">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2530"/>
      <stop offset="1" stop-color="#03141a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(4 10)">
      <rect width="242" height="150" rx="14" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect width="242" height="4" rx="2" fill="url(#accent)"/>
      <text x="121" y="78" fill="#f8fafc" font-size="48" font-weight="800">7</text>
      <text x="121" y="112" fill="#cbd5e1" font-size="17" font-weight="600">Planning dashboards</text>
      <text x="121" y="136" fill="#64748b" font-size="13">Sales to stock levels</text>
    </g>
    <g transform="translate(258 10)">
      <rect width="242" height="150" rx="14" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect width="242" height="4" rx="2" fill="url(#accent)"/>
      <text x="121" y="78" fill="#f8fafc" font-size="48" font-weight="800">600k+</text>
      <text x="121" y="112" fill="#cbd5e1" font-size="17" font-weight="600">POS order lines</text>
      <text x="121" y="136" fill="#64748b" font-size="13">Modelled into monthly history</text>
    </g>
    <g transform="translate(512 10)">
      <rect width="242" height="150" rx="14" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect width="242" height="4" rx="2" fill="url(#accent)"/>
      <text x="121" y="78" fill="#f8fafc" font-size="48" font-weight="800">20 · 8</text>
      <text x="121" y="112" fill="#cbd5e1" font-size="17" font-weight="600">Channels · regions</text>
      <text x="121" y="136" fill="#64748b" font-size="13">Forecast shop by shop</text>
    </g>
    <g transform="translate(766 10)">
      <rect width="242" height="150" rx="14" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect width="242" height="4" rx="2" fill="url(#accent)"/>
      <text x="121" y="78" fill="#f8fafc" font-size="48" font-weight="800">1–12</text>
      <text x="121" y="112" fill="#cbd5e1" font-size="17" font-weight="600">Month horizon</text>
      <text x="121" y="136" fill="#64748b" font-size="13">Seasonality + momentum</text>
    </g>
    <g transform="translate(1020 10)">
      <rect width="256" height="150" rx="14" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect width="256" height="4" rx="2" fill="url(#accent)"/>
      <text x="128" y="78" fill="#f8fafc" font-size="48" font-weight="800">100%</text>
      <text x="128" y="112" fill="#cbd5e1" font-size="17" font-weight="600">Target reconciliation</text>
      <text x="128" y="136" fill="#64748b" font-size="13">Shop plans sum to the target</text>
    </g>
