<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Production Planning and Demand Forecasting: from a revenue target to what to make, what to stock and where to send it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03141a"/>
      <stop offset="0.55" stop-color="#0a2530"/>
      <stop offset="1" stop-color="#2b1d0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>

  <!-- forecast motif: actuals, forecast band, target line -->
  <g transform="translate(840 64)">
    <rect x="0" y="0" width="380" height="232" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="20" cy="20" r="4" fill="#f87171"/><circle cx="34" cy="20" r="4" fill="#fbbf24"/><circle cx="48" cy="20" r="4" fill="#34d399"/>
    <text x="364" y="25" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">FORECAST VS TARGET</text>

    <g transform="translate(24 206)">
      <!-- target line -->
      <line x1="0" y1="-150" x2="336" y2="-150" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 5" stroke-opacity="0.8"/>
      <text x="336" y="-157" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">TARGET</text>
      <!-- actuals area + line -->
      <path d="M0,-58 L28,-74 L56,-66 L84,-92 L112,-84 L140,-104 L168,-98 L196,-118 L196,0 L0,0 Z" fill="url(#area)"/>
      <polyline points="0,-58 28,-74 56,-66 84,-92 112,-84 140,-104 168,-98 196,-118" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- forecast band + line -->
      <path d="M196,-118 L224,-138 L252,-146 L280,-160 L308,-170 L336,-180 L336,-128 L308,-124 L280,-120 L252,-112 L224,-110 L196,-118 Z" fill="url(#band)"/>
      <polyline points="196,-118 224,-124 252,-129 280,-140 308,-147 336,-154" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- "today" divider -->
      <line x1="196" y1="-188" x2="196" y2="0" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <g fill="#03141a" stroke="#2dd4bf" stroke-width="2.5">
        <circle cx="84" cy="-92" r="4.5"/><circle cx="140" cy="-104" r="4.5"/><circle cx="196" cy="-118" r="5"/>
      </g>
      <circle cx="336" cy="-154" r="5" fill="#03141a" stroke="#fbbf24" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="336" y2="0" stroke="#ffffff" stroke-opacity="0.15"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="3.5">FORECASTING · DATA ENGINEERING · BUSINESS INTELLIGENCE</text>
    <text x="64" y="148" fill="#f8fafc" font-size="50" font-weight="800">Production Planning &amp;</text>
    <text x="64" y="204" fill="url(#accent)" font-size="50" font-weight="800">Demand Forecasting</text>
    <rect x="64" y="226" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="264" fill="#cbd5e1" font-size="19">From one revenue target to what to make, which materials</text>
    <text x="64" y="290" fill="#cbd5e1" font-size="19">to buy, and how much stock every shop should hold.</text>
    <text x="64" y="328" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1">LLOYD MWITI MUGO · DATA ANALYST &amp; DATA ENGINEER</text>
  </g>
</svg>
